<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bill Scanner</title>
<style>
:root{--bg:#eceff3;--card:#fff;--ink:#14202b;--mut:#5d6b78;--acc:#f2b705;--accink:#14202b;--line:#d3d9e0;--hl:#1b6ef3;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e151d;--card:#18222d;--ink:#eef2f6;--mut:#93a1af;--acc:#ffc82e;--accink:#14202b;--line:#2a3745;--hl:#6aa4ff}}
:root[data-theme="dark"]{--bg:#0e151d;--card:#18222d;--ink:#eef2f6;--mut:#93a1af;--acc:#ffc82e;--accink:#14202b;--line:#2a3745;--hl:#6aa4ff}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 "Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif;min-height:100%}
main{max-width:520px;margin:0 auto;padding:18px 16px 40px}
h1{font-size:26px;margin:4px 0 2px;letter-spacing:-.01em}
.sub{color:var(--mut);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
label{display:block;font-weight:600;margin-bottom:6px}
input[type=email]{width:100%;font:inherit;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
input:focus-visible,button:focus-visible,a.btn:focus-visible{outline:3px solid var(--hl);outline-offset:2px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;font:inherit;font-weight:700;padding:14px;border-radius:12px;border:0;background:var(--acc);color:var(--accink);cursor:pointer;text-decoration:none;margin-top:10px}
.btn.alt{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.hint{color:var(--mut);font-size:14px;margin:8px 0 0}
.err{color:#d6336c;font-size:14px;margin:6px 0 0;min-height:1em}
.steps{display:flex;gap:6px;margin:0 0 16px}
.steps i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.steps i.on{background:var(--acc)}
#ed{display:block;margin:0 auto;max-width:100%;max-height:66vh;touch-action:none;border-radius:8px;background:#000}
.seg{display:flex;gap:6px;margin:0 0 12px}
.seg button{flex:1;font:inherit;font-weight:600;padding:9px 4px;border-radius:10px;border:1.5px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.receipt{position:relative;background:#fff;padding:10px 10px 18px;border-radius:4px;box-shadow:0 6px 18px rgba(0,0,0,.18);margin:6px 6px 20px}
.receipt::after{content:"";position:absolute;left:0;right:0;bottom:-9px;height:10px;background:linear-gradient(135deg,#fff 50%,transparent 50%) 0 0/14px 10px,linear-gradient(225deg,#fff 50%,transparent 50%) 0 0/14px 10px}
.receipt img{display:block;width:100%;height:auto;max-height:60vh;object-fit:contain;margin:0 auto}
.row2{display:flex;gap:6px;margin:0 0 12px}
.row2 button{flex:1;font:inherit;font-weight:600;padding:10px 4px;border-radius:10px;border:1.5px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.hide{display:none}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0);pointer-events:none}
.ok{color:#1d9a6c;font-weight:600;font-size:14px;margin:8px 0 0}
</style>
</head>
<body>
<main>
  <h1>Bill scanner</h1>
  <p class="sub">Snap a petrol bill, trim it to the edges, send it to your inbox.</p>
  <div class="steps" aria-hidden="true"><i id="p1" class="on"></i><i id="p2"></i><i id="p3"></i></div>

  <section id="s1">
    <div class="card">
      <label for="to">Your email (for backup options)</label>
      <input id="to" type="email" inputmode="email" autocomplete="email" placeholder="name@example.com">
      <p class="err" id="toerr"></p>
    </div>
    <input id="file" type="file" accept="image/*" class="vh">
    <label class="btn" id="pick" for="file">Choose or take a bill photo</label>
    <details class="card" id="setup"><summary><b>One-time setup: auto-send</b></summary>
      <label for="gas" style="margin-top:12px">Apps Script web app URL</label>
      <input id="gas" type="url" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off" style="width:100%;font:inherit;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)">
      <label for="sec" style="margin-top:12px">Secret word (same as in your script)</label>
      <input id="sec" type="password" autocomplete="off" style="width:100%;font:inherit;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)">
      <p class="hint">Saved only in this browser.</p>
    </details>
    <p class="hint">The photo stays on your phone until you tap Send.</p>
  </section>

  <section id="s2" class="hide">
    <div class="card">
      <canvas id="ed" aria-label="Bill photo with draggable corner handles"></canvas>
      <p class="hint" id="det" role="status"></p>
    </div>
    <div class="row2"><button id="auto">Auto-detect again</button><button id="whole">Use whole photo</button></div>
    <button class="btn" id="scan">Scan this bill</button>
    <button class="btn alt" id="back1">Choose another photo</button>
  </section>

  <section id="s3" class="hide">
    <div class="seg" role="group" aria-label="Scan style">
      <button data-m="color" aria-pressed="true">Enhanced</button>
      <button data-m="bw" aria-pressed="false">Black &amp; white</button>
      <button data-m="orig" aria-pressed="false">Original</button>
    </div>
    <div class="receipt"><img id="out" alt="Scanned bill"></div>
    <button class="btn" id="send">Send email now</button>
    <p class="hint">Backup options if sending fails:</p>
    <div class="card"><label for="to2">Send to</label><input id="to2" type="email" inputmode="email" autocomplete="email" placeholder="name@example.com"></div>
    <button class="btn alt" id="share">Share to Mail app</button>
    <a class="btn alt" id="mailto" href="#" target="_blank" rel="noopener noreferrer">Open email draft to <span id="mt"></span></a>
    <a class="btn alt" id="gmail" href="#" target="_blank" rel="noopener noreferrer">Compose in Gmail</a>
    
    <p class="ok" id="msg" role="status"></p>
    <button class="btn alt" id="again">Scan another bill</button>
  </section>
</main>

<script>
(function(){
var $=function(i){return document.getElementById(i)};
var src=document.createElement('canvas'),sctx=src.getContext('2d',{willReadFrequently:true});
var detOK=true,ed=$('ed'),ex=ed.getContext('2d'),pts=[],K=1,drag=-1,warped=null,mode='color',blobUrl=null;

/* saved address */
try{var sv=localStorage.getItem('billTo');if(sv)$('to').value=sv}catch(e){}
function validTo(){var v=$('to').value.trim();return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)?v:null}
function step(n){['s1','s2','s3'].forEach(function(s,i){$(s).classList.toggle('hide',i!==n-1)});
  ['p1','p2','p3'].forEach(function(s,i){$(s).classList.toggle('on',i<n)});window.scrollTo(0,0)}

$('to').addEventListener('input',function(){if(validTo()){$('toerr').textContent='';try{localStorage.setItem('billTo',validTo())}catch(e){}}});
$('file').onchange=function(){var f=this.files[0];if(f)load(f);this.value=''};
$('back1').onclick=function(){step(1)};
$('auto').onclick=function(){$('det').dataset.m='';pts=detect();drawEd();note()};
$('whole').onclick=function(){$('det').dataset.m='1';detOK=true;pts=[{x:0,y:0},{x:src.width,y:0},{x:src.width,y:src.height},{x:0,y:src.height}];drawEd();var t=$('det');t.style.color='var(--mut)';t.textContent='Using the whole photo. Drag the corners in to fit the bill.'}
$('again').onclick=function(){step(1)};
function setMail(){var to=validTo()||'',d=new Date().toISOString().slice(0,10);
  $('mt').textContent=to||'your address';
  $('gmail').href='https://mail.google.com/mail/?view=cm&fs=1&to='+encodeURIComponent(to)+'&su='+encodeURIComponent('Petrol bill '+d)+'&body='+encodeURIComponent('Petrol bill scan dated '+d+' is attached.');
  $('mailto').href='mailto:'+encodeURIComponent(to).replace('%40','@')+'?subject='+encodeURIComponent('Petrol bill '+d)+'&body='+encodeURIComponent('Petrol bill scan dated '+d+' is attached.')}
$('to2').addEventListener('input',function(){$('to').value=this.value;if(validTo()){try{localStorage.setItem('billTo',validTo())}catch(e){}}setMail()});
$('mailto').addEventListener('click',function(e){var to=validTo();
  if(!to){e.preventDefault();$('msg').textContent='Enter a valid email address above first.';return}
  try{navigator.clipboard.writeText(to).then(function(){$('msg').textContent='Address copied ('+to+'). If your mail app didn’t open, open it and paste the address.'},function(){})}catch(x){}});

function load(f){
  var p=window.createImageBitmap?createImageBitmap(f,{imageOrientation:'from-image'}):Promise.reject();
  p.catch(function(){return new Promise(function(res,rej){var im=new Image();im.onload=function(){res(im)};im.onerror=rej;im.src=URL.createObjectURL(f)})})
   .then(function(b){
    var w=b.width||b.naturalWidth,h=b.height||b.naturalHeight,s=Math.min(1,2400/Math.max(w,h));
    src.width=Math.round(w*s);src.height=Math.round(h*s);sctx.drawImage(b,0,0,src.width,src.height);
    $('det').dataset.m='';pts=detect();setupEd();note();step(2)})
   .catch(function(){$('toerr').textContent='Could not read that image.'})}

/* ---- edge detection: find the large bright (or dark) blob, use its extreme corners ---- */
function detect(){
  var s=360/Math.max(src.width,src.height),W=Math.max(8,Math.round(src.width*s)),H=Math.max(8,Math.round(src.height*s));
  var c=document.createElement('canvas');c.width=W;c.height=H;var x=c.getContext('2d',{willReadFrequently:true});
  x.drawImage(src,0,0,W,H);var d=x.getImageData(0,0,W,H).data,g=new Float32Array(W*H),i,j;
  for(i=0;i<W*H;i++)g[i]=.299*d[i*4]+.587*d[i*4+1]+.114*d[i*4+2];
  var b=new Float32Array(W*H);
  for(var y=1;y<H-1;y++)for(var xx=1;xx<W-1;xx++){var o=y*W+xx;b[o]=(g[o-W-1]+g[o-W]+g[o-W+1]+g[o-1]+g[o]+g[o+1]+g[o+W-1]+g[o+W]+g[o+W+1])/9}
  var hist=new Array(256).fill(0);for(i=0;i<W*H;i++)hist[b[i]|0]++;
  var tot=W*H,sum=0;for(i=0;i<256;i++)sum+=i*hist[i];
  var wb=0,sb=0,best=0,t=128;
  for(i=0;i<256;i++){wb+=hist[i];if(!wb)continue;var wf=tot-wb;if(!wf)break;sb+=i*hist[i];
    var mb=sb/wb,mf=(sum-sb)/wf,v=wb*wf*(mb-mf)*(mb-mf);if(v>best){best=v;t=i}}
  var res=null;
  [true,false].forEach(function(bright){
    if(res)return;var r=blob(function(o){return bright?b[o]>t:b[o]<=t},W,H);
    if(r&&r.size/tot>.12&&r.size/tot<.93)res=r});
  var full=[{x:src.width*.08,y:src.height*.06},{x:src.width*.92,y:src.height*.06},{x:src.width*.92,y:src.height*.94},{x:src.width*.08,y:src.height*.94}];
  if(!res){detOK=false;return full}
  var q=res.c,ar=Math.abs(q[0].x*q[1].y-q[1].x*q[0].y+q[1].x*q[2].y-q[2].x*q[1].y+q[2].x*q[3].y-q[3].x*q[2].y+q[3].x*q[0].y-q[0].x*q[3].y)/2;
  detOK=ar>tot*.15&&res.size/Math.max(ar,1)>.72;
  if(!detOK&&ar<tot*.15)return full;
  return res.c.map(function(p){return{x:Math.min(src.width,Math.max(0,p.x/s)),y:Math.min(src.height,Math.max(0,p.y/s))}})}

function blob(test,W,H){
  var seen=new Uint8Array(W*H),best=null,st=[];
  for(var s0=0;s0<W*H;s0++){
    if(seen[s0]||!test(s0))continue;
    var size=0,mnS=1e9,mxS=-1e9,mnD=1e9,mxD=-1e9,TL,BR,TR,BL;st.length=0;st.push(s0);seen[s0]=1;
    while(st.length){var o=st.pop(),px=o%W,py=(o/W)|0;size++;
      var a=px+py,dd=px-py;
      if(a<mnS){mnS=a;TL={x:px,y:py}}if(a>mxS){mxS=a;BR={x:px,y:py}}
      if(dd>mxD){mxD=dd;TR={x:px,y:py}}if(dd<mnD){mnD=dd;BL={x:px,y:py}}
      if(px>0&&!seen[o-1]&&test(o-1)){seen[o-1]=1;st.push(o-1)}
      if(px<W-1&&!seen[o+1]&&test(o+1)){seen[o+1]=1;st.push(o+1)}
      if(py>0&&!seen[o-W]&&test(o-W)){seen[o-W]=1;st.push(o-W)}
      if(py<H-1&&!seen[o+W]&&test(o+W)){seen[o+W]=1;st.push(o+W)}}
    if(!best||size>best.size)best={size:size,c:[TL,TR,BR,BL]}}
  return best}

/* ---- corner editor ---- */
function setupEd(){
  K=Math.min(1,1200/Math.max(src.width,src.height));
  ed.width=Math.round(src.width*K);ed.height=Math.round(src.height*K);drawEd()}
function note(){var e=$('det');e.style.fontWeight='600';
  if(detOK){e.style.color='#1d9a6c';e.textContent='Edges found automatically. If anything looks off, drag a corner.'}
  else{e.style.color='#e5484d';e.textContent='Couldn’t find the edges on this photo. Drag the four corners onto the bill, then tap Scan.'}}
function drawEd(){
  ex.drawImage(src,0,0,ed.width,ed.height);
  ex.beginPath();pts.forEach(function(p,i){ex[i?'lineTo':'moveTo'](p.x*K,p.y*K)});ex.closePath();
  ex.fillStyle=detOK?'rgba(242,183,5,.16)':'rgba(255,90,95,.16)';ex.fill();ex.lineWidth=Math.max(2,ed.width/260);ex.strokeStyle=detOK?'#f2b705':'#ff5a5f';ex.stroke();
  var r=Math.max(12,ed.width/32);
  pts.forEach(function(p){ex.beginPath();ex.arc(p.x*K,p.y*K,r,0,7);ex.fillStyle='rgba(20,32,43,.55)';ex.fill();
    ex.lineWidth=Math.max(2.5,ed.width/200);ex.strokeStyle='#fff';ex.stroke()})}
function at(e){var r=ed.getBoundingClientRect();return{x:(e.clientX-r.left)*ed.width/r.width/K,y:(e.clientY-r.top)*ed.height/r.height/K}}
ed.addEventListener('pointerdown',function(e){
  var q=at(e),bd=1e9,r=ed.getBoundingClientRect(),sc=ed.width/r.width;drag=-1;
  pts.forEach(function(p,i){var d=Math.hypot(p.x-q.x,p.y-q.y)*K;if(d<bd){bd=d;drag=i}});
  if(bd>56*sc)drag=-1;if(drag>-1){ed.setPointerCapture(e.pointerId);e.preventDefault()}});
ed.addEventListener('pointermove',function(e){if(drag<0)return;var q=at(e);
  if(!detOK||$('det').dataset.m!=='1'){detOK=true;$('det').dataset.m='1';var t=$('det');t.style.color='var(--mut)';t.textContent='Adjusting manually. Tap Scan when the outline fits the bill.'}
  pts[drag]={x:Math.min(src.width,Math.max(0,q.x)),y:Math.min(src.height,Math.max(0,q.y))};drawEd()});
['pointerup','pointercancel'].forEach(function(n){ed.addEventListener(n,function(){drag=-1})});

/* ---- perspective warp ---- */
function solve(A,B){var n=B.length,i,j,k;for(i=0;i<n;i++){var m=i;for(j=i+1;j<n;j++)if(Math.abs(A[j][i])>Math.abs(A[m][i]))m=j;
  var t=A[i];A[i]=A[m];A[m]=t;t=B[i];B[i]=B[m];B[m]=t;
  for(j=i+1;j<n;j++){var f=A[j][i]/A[i][i];for(k=i;k<n;k++)A[j][k]-=f*A[i][k];B[j]-=f*B[i]}}
  var x=new Array(n);for(i=n-1;i>=0;i--){var s=B[i];for(j=i+1;j<n;j++)s-=A[i][j]*x[j];x[i]=s/A[i][i]}return x}
function warp(){
  var P=pts,L=function(a,b){return Math.hypot(a.x-b.x,a.y-b.y)};
  var w=Math.max(L(P[0],P[1]),L(P[3],P[2])),h=Math.max(L(P[0],P[3]),L(P[1],P[2]));
  var s=Math.min(1,2000/Math.max(w,h,1));w=Math.max(40,Math.round(w*s));h=Math.max(40,Math.round(h*s));
  var D=[[0,0],[w,0],[w,h],[0,h]],A=[],B=[];
  for(var i=0;i<4;i++){var u=D[i][0],v=D[i][1],X=P[i].x,Y=P[i].y;
    A.push([u,v,1,0,0,0,-u*X,-v*X]);B.push(X);A.push([0,0,0,u,v,1,-u*Y,-v*Y]);B.push(Y)}
  var q=solve(A,B),sd=sctx.getImageData(0,0,src.width,src.height).data,SW=src.width,SH=src.height;
  var out=new ImageData(w,h),od=out.data;
  for(var y=0;y<h;y++)for(var x=0;x<w;x++){
    var z=q[6]*x+q[7]*y+1,sx=(q[0]*x+q[1]*y+q[2])/z,sy=(q[3]*x+q[4]*y+q[5])/z;
    sx=Math.min(SW-1.001,Math.max(0,sx));sy=Math.min(SH-1.001,Math.max(0,sy));
    var x0=sx|0,y0=sy|0,fx=sx-x0,fy=sy-y0,o=(y*w+x)*4;
    for(var c=0;c<3;c++){var i00=(y0*SW+x0)*4+c,i10=i00+4,i01=i00+SW*4,i11=i01+4;
      od[o+c]=sd[i00]*(1-fx)*(1-fy)+sd[i10]*fx*(1-fy)+sd[i01]*(1-fx)*fy+sd[i11]*fx*fy}
    od[o+3]=255}
  return out}

/* ---- scan filters (flatten uneven light, whiten paper) ---- */
function paint(img,m){
  var w=img.width,h=img.height,c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').putImageData(img,0,0);
  var res=document.createElement('canvas');res.width=w;res.height=h;var rx=res.getContext('2d');
  if(m==='orig'){rx.drawImage(c,0,0)}
  else{
    var sm=document.createElement('canvas');sm.width=Math.max(4,w>>4);sm.height=Math.max(4,h>>4);var smx=sm.getContext('2d');
    smx.imageSmoothingEnabled=true;smx.drawImage(c,0,0,sm.width,sm.height);
    var bg=document.createElement('canvas');bg.width=w;bg.height=h;var bx=bg.getContext('2d');bx.imageSmoothingEnabled=true;bx.drawImage(sm,0,0,w,h);
    var bd=bx.getImageData(0,0,w,h).data,o=img.data,r=new ImageData(w,h),rd=r.data;
    for(var i=0;i<w*h*4;i+=4){
      var l=.299*bd[i]+.587*bd[i+1]+.114*bd[i+2];l=Math.max(l,40);var f=238/l;
      if(m==='bw'){var g=(.299*o[i]+.587*o[i+1]+.114*o[i+2])*f;g=(g-125)*255/(232-125);g=g<0?0:g>255?255:g;rd[i]=rd[i+1]=rd[i+2]=g}
      else{for(var k=0;k<3;k++){var v=o[i+k]*f;v=(v-18)*1.12;rd[i+k]=v<0?0:v>255?255:v}}
      rd[i+3]=255}
    rx.putImageData(r,0,0)}
  return res}
function render(){
  var cv=paint(warped,mode);
  cv.toBlob(function(bl){if(!bl)return;if(blobUrl)URL.revokeObjectURL(blobUrl);blobUrl=URL.createObjectURL(bl);$('out').src=blobUrl;window._blob=bl},'image/jpeg',.92)}
$('scan').onclick=function(){
  $('scan').disabled=true;$('scan').textContent='Scanning…';
  setTimeout(function(){warped=warp();mode='color';
    document.querySelectorAll('.seg button').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.m===mode)});
    render();$('to2').value=$('to').value;setMail();$('msg').textContent='';
    $('scan').disabled=false;$('scan').textContent='Scan this bill';step(3)},30)};
document.querySelectorAll('.seg button').forEach(function(b){b.onclick=function(){mode=b.dataset.m;
  document.querySelectorAll('.seg button').forEach(function(x){x.setAttribute('aria-pressed',x===b)});render()}});

/* ---- share to mail ---- */
$('share').onclick=function(){
  var bl=window._blob;if(!bl)return;var d=new Date().toISOString().slice(0,10);
  var f=new File([bl],'petrol-bill-'+d+'.jpg',{type:'image/jpeg'}),data={files:[f],title:'Petrol bill '+d,text:'Petrol bill scan dated '+d+'. Send to: '+(validTo()||'')};
  if(navigator.canShare&&navigator.canShare(data)){
    navigator.share(data).then(function(){$('msg').textContent='Shared. Pick your Mail app and send to '+(validTo()||'your address')+'.'}).catch(function(e){if(e&&e.name!=='AbortError')$('msg').textContent='Sharing failed. Save the image (touch and hold it) and use the email draft button.'})
  }else{copyImg(bl).then(function(ok){$('msg').textContent=ok?'Sharing isn’t available in this view, so the scan was copied instead. Tap “Open email draft”, then touch and hold the message body and choose Paste.':'Sharing isn’t available in this view. Touch and hold the receipt to save it, then tap “Open email draft” and attach the saved image.'})}};
function copyImg(bl){try{if(!(navigator.clipboard&&window.ClipboardItem&&window.createImageBitmap))return Promise.resolve(false);
  var p=createImageBitmap(bl).then(function(b){var c=document.createElement('canvas');c.width=b.width;c.height=b.height;c.getContext('2d').drawImage(b,0,0);return new Promise(function(r){c.toBlob(r,'image/png')})});
  return navigator.clipboard.write([new ClipboardItem({'image/png':p})]).then(function(){return true},function(){return false})}catch(e){return Promise.resolve(false)}}

/* ---- auto-send through Google Apps Script ---- */
function lsGet(k){try{return localStorage.getItem(k)||''}catch(e){return ''}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
var GAS_URL='https://script.google.com/macros/s/AKfycbw06qP5_N-i09jFsL1fiU9Xy7wtoHvpCzU4_Jo6uxXUZi2VrHrGlvVUCB36vJmNC-hy/exec',GAS_SECRET='dracosecret';
$('gas').value=lsGet('billGas')||GAS_URL;$('sec').value=lsGet('billSec')||GAS_SECRET;
$('gas').addEventListener('input',function(){lsSet('billGas',this.value.trim())});
$('sec').addEventListener('input',function(){lsSet('billSec',this.value)});
$('send').onclick=function(){
  var url=$('gas').value.trim(),bl=window._blob;
  if(!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(url)){$('msg').textContent='Add your Apps Script web app URL in the one-time setup on the first screen.';return}
  if(!bl)return;var btn=$('send'),d=new Date().toISOString().slice(0,10);
  btn.disabled=true;btn.textContent='Sending…';$('msg').textContent='';
  var fr=new FileReader();
  fr.onload=function(){
    fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({secret:$('sec').value,image:fr.result.split(',')[1],name:'petrol-bill-'+d+'.jpg',subject:'Petrol bill '+d})})
    .then(function(r){return r.json()})
    .then(function(j){$('msg').textContent=j.ok?'Sent! Check your inbox.':'Not sent: '+(j.error||'unknown error')})
    .catch(function(){$('msg').textContent='Couldn’t confirm delivery. Check your inbox before trying again.'})
    .then(function(){btn.disabled=false;btn.textContent='Send email now'})};
  fr.onerror=function(){btn.disabled=false;btn.textContent='Send email now';$('msg').textContent='Could not read the scan.'};
  fr.readAsDataURL(bl)};
})();
</script>
